[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "duck-aligner"
version = "0.1.0"
description = "Lazy FASTQ sequence alignment and variant detection using DuckDB"
authors = ["Kevin Savage <kevinpetersavage@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "duck_aligner"}]

[tool.poetry.dependencies]
python = "^3.10"
duckdb = ">=1.0.0"
parasail = ">=1.3.4"
edlib = ">=1.3.9"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"

[tool.poetry.scripts]
duck-aligner = "duck_aligner.cli:main"
